[project]
name = "music-to-partition"
version = "1.0.0"
description = "Piano music transcription: converts audio files to music sheet PDFs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "librosa",
    "python-multipart",
    "music21",
    "transformers",
    "torch",
    "pretty-midi==0.2.9",
    "essentia",
    "scipy",
    "resampy",
    "pyfluidsynth",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
constraint-dependencies = [
    "setuptools<82",
]
