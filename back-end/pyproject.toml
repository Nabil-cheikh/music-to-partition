[project]
name = "music-to-partition"
version = "1.0.0"
description = "Piano music transcription: converts audio files to music sheet PDFs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "librosa",
    "python-multipart",
    "music21",
    "torch",
    "transkun>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "pyfluidsynth",
    "pretty-midi",
    "scipy",
    "mir-eval>=0.8.2",
]
# Ancien backend (ADR-0001, remplacé par ADR-0005) : uv sync --group pop2piano
pop2piano = [
    "transformers",
    "essentia",
    "resampy",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: runs the transcription model (tests/test_transcription_eval.py, tests/test_transcription.py)"]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
